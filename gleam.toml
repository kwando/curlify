[dependencies]
gleam_stdlib = ">= 0.67.1 and < 2.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"

[dev-dependencies]
gleeunit = ">= 1.9.0 and < 2.0.0"
birdie = ">= 2.0.0 and < 3.0.0"
